name: daily-review
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      test: {description: 'skip the webhook', type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: daily-review}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            oi.json
            wakes.json
          key: review-${{ github.run_id }}
          restore-keys: seen-
      - name: review
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
          TEST: ${{ inputs.test }}
        run: python3 review.py
      - name: commit review
        run: |
          git config user.name "Grok Bot"; git config user.email "jiffyjoker@users.noreply.github.com"
          git add reviews/ && git commit -m "Daily review $(date -u +%F)" && git pull --rebase -q && git push || echo "nothing to commit"
