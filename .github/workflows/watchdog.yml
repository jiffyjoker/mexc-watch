name: watchdog
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test: {description: 'check only, no action', type: boolean, default: false}
      loop: {description: 'self-chain loop (11 checks, 30 min apart)', type: boolean, default: true}
permissions:
  actions: write
  contents: read
concurrency:
  group: watchdog-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: watch the scanner
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.loop }}" = "true" ] && [ "$TEST" != "true" ]; then N=11; else N=1; fi
          for i in $(seq 1 $N); do python3 watchdog.py || echo "watchdog error"; if [ $i -lt $N ]; then sleep 1800; fi; done
      - name: relaunch self
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.loop && !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog -R ${{ github.repository }} -f loop=true
