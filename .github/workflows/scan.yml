name: mexc-scan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: mexc-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q websockets
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            oi.json
            wakes.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: scan chunk 1
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
          LIVE: '1'
        run: |
          python3 scan.py || echo "scan error"
          python3 live.py --minutes 29.5 > live_1.log 2>&1 &
          for i in 1 2 3 4 5; do sleep 300; python3 scan.py || echo "scan error"; done
          wait; grep -E "hb|hot|stage2|ws down|POST|skip|Error" live_1.log | tail -200 || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen.json
            oi.json
            wakes.json
          key: seen-${{ github.run_id }}-1
      - name: scan chunk 2
