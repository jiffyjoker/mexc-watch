name: mexc-scan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: mexc-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            oi.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: scan chunk 1
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
        run: for i in 1 2 3 4 5 6; do python3 scan.py || echo "scan error"; sleep 300; done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen.json
            oi.json
          key: seen-${{ github.run_id }}-1
      - name: scan chunk 2
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
        run: for i in 1 2 3 4 5 6; do python3 scan.py || echo "scan error"; sleep 300; done
      - uses: actions/cache/save@v4
        if: always()
