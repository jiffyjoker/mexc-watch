name: mexc-scan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: mexc-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - name: scan every 5 min for ~5.6h
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.WEBHOOK_AUTH }}
        run: |
          for i in $(seq 1 67); do
            python3 scan.py || echo "scan error"
            sleep 300
          done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
      - name: relaunch self
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mexc-scan -R ${{ github.repository }}
